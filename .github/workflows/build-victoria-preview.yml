name: Build Victoria preview snapshot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4
      - run: python scripts/build_victoria_preview_snapshot.py
      - uses: actions/upload-artifact@v4
        with:
          name: victoria-preview-snapshot
          path: |
            data/victoria-preview.json
            data/victoria-preview-meta.json
