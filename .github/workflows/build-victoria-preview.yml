name: Build Victoria preview snapshot
on:
  push:
    branches: [feat/full-victoria-preview]
    paths:
      - scripts/build_victoria_preview_snapshot.py
      - .github/workflows/build-victoria-preview.yml
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/full-victoria-preview
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4
      - run: python scripts/build_victoria_preview_snapshot.py
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/victoria-preview.json data/victoria-preview-meta.json
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh Victoria client preview snapshot"
          git push origin HEAD:feat/full-victoria-preview
