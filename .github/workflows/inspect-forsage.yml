name: Inspect Forsage catalog
on:
  push:
    branches: [ops/forsage-catalog-inspect]
  pull_request:
    branches: [main]
    paths:
      - scripts/inspect_forsage_catalog.py
      - .github/workflows/inspect-forsage.yml
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4
      - name: Fetch and inspect all catalog pages
        run: python scripts/inspect_forsage_catalog.py
      - uses: actions/upload-artifact@v4
        with:
          name: forsage-full-catalog
          path: |
            forsage-victoria-full.json
            forsage-victoria-summary.json
